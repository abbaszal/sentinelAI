[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Local-first self-evaluating agentic AI platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "httpx",
    "scikit-learn",
    "sentence-transformers",
    "faiss-cpu",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "sentinel*",
    "database*",
    "apps*",
]
exclude = [
    "tests*",
    "data*",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]